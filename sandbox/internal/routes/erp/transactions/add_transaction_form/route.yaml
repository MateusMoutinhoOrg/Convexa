    form-schema:
        properties:
            account:
                type: string
            amount:
                type: string
            card-invoice:
                type: string
            category:
                type: string
            company:
                type: string
            date:
                type: string
            description:
                type: string
            document-number:
                type: string
            due-date:
                type: string
            installments:
                type: string
            next:
                type: string
            notes:
                type: string
            settled:
                type: string
            settled-date:
                type: string
            third-party:
                type: string
            type:
                type: string
        type: object
    max-bytes: 65536
    required: true
    type: form
