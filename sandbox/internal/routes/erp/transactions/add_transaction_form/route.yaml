methods:
    - POST
paths:
    - end: -1
      id: AdminManageAddTransaction
      start: 0
      trigger:
        type: equal
        value: /admin/manage/add-transaction
priority: 100
private: true
response-type: text/html
summary: Adds a transaction, or a purchase in installments
