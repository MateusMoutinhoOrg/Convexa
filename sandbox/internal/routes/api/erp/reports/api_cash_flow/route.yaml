body:
    content-type: application/json
    json-schema:
        properties:
            account:
                type: integer
            basis:
                type: string
            category:
                type: integer
            company:
                type: integer
            from:
                type: string
            group:
                type: string
            third-party:
                type: integer
            to:
                type: string
        type: object
    max-bytes: 1048576
    type: json
category: Reports
examples:
    - 'curl -X POST localhost:3000/api/admin/erp/cash-flow -H "Authorization: Bearer $TOKEN" -H ''Content-Type: application/json'' -d ''{"from":"2026-10-01","to":"2026-12-31","group":"month","basis":"projected","company":0,"account":0,"category":0,"third-party":0}'''
methods:
    - POST
paths:
    - end: -1
      id: ApiAdminErpCashFlow
      start: 0
      trigger:
        type: equal
        value: /api/admin/erp/cash-flow
priority: 100
response-type: application/json
summary: Answers the cash flow of a period
