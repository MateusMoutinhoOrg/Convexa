body:
    content-type: application/json
    json-schema:
        properties:
            account:
                type: integer
            company:
                type: integer
            from:
                type: string
            to:
                type: string
        type: object
    max-bytes: 1048576
    type: json
category: Reports
examples:
    - 'curl -X POST localhost:3000/api/admin/erp/account-statement -H "Authorization: Bearer $TOKEN" -H ''Content-Type: application/json'' -d ''{"account":1,"company":0,"from":"2026-10-01","to":"2026-10-31"}'''
methods:
    - POST
paths:
    - end: -1
      id: ApiAdminErpAccountStatement
      start: 0
      trigger:
        type: equal
        value: /api/admin/erp/account-statement
priority: 100
response-type: application/json
summary: Answers the statement of an account
