body:
    content-type: application/json
    json-schema:
        properties:
            category:
                type: integer
            company:
                type: integer
            from:
                type: string
            to:
                type: string
        type: object
    max-bytes: 1048576
    type: json
category: Reports
examples:
    - 'curl -X POST localhost:3000/api/admin/erp/budget-report -H "Authorization: Bearer $TOKEN" -H ''Content-Type: application/json'' -d ''{"company":0,"category":0,"from":"2026-10-01","to":"2026-10-31"}'''
methods:
    - POST
paths:
    - end: -1
      id: ApiAdminErpBudgetReport
      start: 0
      trigger:
        type: equal
        value: /api/admin/erp/budget-report
priority: 100
response-type: application/json
summary: Sets every budget against what happened
