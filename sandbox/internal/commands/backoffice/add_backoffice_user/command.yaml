args:
    - end: 0
      id: Verb
      start: 0
      trigger:
        type: equal
        value: add-backoffice-user
category: Backoffice
description: 'Adds a backoffice user under the same rules as the add form: the username and the email unique across both, regardless of case, and a valid email. The password is generated and printed once, so it never travels on the command line; change it on the edit page. --role defaults to basic: give the first user --role root.'
examples:
    - add-backoffice-user --username admin --email admin@example.com --role root
flags:
    - description: the username for the backoffice user
      id: Username
      required: true
    - description: the email for the backoffice user
      id: Email
      required: true
    - default: basic
      description: 'the role of the backoffice user: root controls everything (users, backups), admin manages the financial records, basic only reads'
      enum:
        - root
        - admin
        - basic
      id: Role
priority: 100
summary: Create a backoffice user with a generated password, printed once
