{{define "content"}}
<main class="narrow">
  <a class="back" href="{{.Body.Form.Back}}">&larr; {{call .T "Back to third parties"}}</a>
  <div class="card">
    <h1>{{call .T .Body.Form.Title}}</h1>
    {{template "form-error" .}}
    <form action="{{.Body.Form.Action}}" method="POST">
      <div class="form-grid">
        <div class="form-group full">
          <label for="name">{{call .T "Name"}}</label>
          <input type="text" id="name" name="name" value="{{.Body.Fields.Name}}" required maxlength="160" autofocus>
        </div>
        <div class="form-group">
          <label for="role">{{call .T "Role"}}</label>
          <select id="role" name="role">
            {{range .Body.Roles}}<option value="{{.Value}}"{{if .Selected}} selected{{end}}>{{call $.T .Label}}</option>{{end}}
          </select>
        </div>
        <div class="form-group">
          <label for="document">{{call .T "Document"}}</label>
          <input type="text" id="document" name="document" value="{{.Body.Fields.Document}}" maxlength="40">
        </div>
        <div class="form-group">
          <label for="email">{{call .T "Email"}}</label>
          <input type="email" id="email" name="email" value="{{.Body.Fields.Email}}" maxlength="254">
        </div>
        <div class="form-group">
          <label for="phone">{{call .T "Phone"}}</label>
          <input type="text" id="phone" name="phone" value="{{.Body.Fields.Phone}}" maxlength="40">
        </div>
        <div class="form-group full">
          <label for="address">{{call .T "Address"}}</label>
          <input type="text" id="address" name="address" value="{{.Body.Fields.Address}}" maxlength="500">
        </div>
        <div class="form-group full">
          <label for="notes">{{call .T "Notes"}}</label>
          <textarea id="notes" name="notes" maxlength="2000">{{.Body.Fields.Notes}}</textarea>
        </div>
      </div>
      <div style="margin-top:1.1rem;">{{template "status-select" .}}</div>
      {{template "form-actions" .}}
    </form>
  </div>
  {{template "form-remove" .}}
</main>
{{end}}
