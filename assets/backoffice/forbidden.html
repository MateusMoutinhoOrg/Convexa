{{define "content"}}
<main class="narrow">
  <div class="card">
    <div class="muted small" style="font-weight:700; letter-spacing:0.08em; text-transform:uppercase; margin-bottom:0.5rem;">403 · {{call .T "Forbidden"}}</div>
    <h1>{{call .T "Your role does not allow this"}}</h1>
    <p class="muted">{{.Body.Reason}}</p>
    <div class="form-actions">
      <a class="btn btn-primary" href="/admin/erp/dashboard">{{call .T "Dashboard"}}</a>
      <a class="btn" href="/admin/home">{{call .T "My account"}}</a>
    </div>
  </div>
</main>
{{end}}
